name: Question
description: Задайте вопрос о проекте
title: "[Question]: "
labels: ["❓ question"]
body:
  - type: markdown
    attributes:
      value: |
        Вопросы приветствуются! Будьте конкретны, чтобы мы могли помочь быстро.
  - type: textarea
    id: question
    attributes:
      label: Ваш вопрос
      description: Что вы хотели бы узнать?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Что вы уже пробовали или проверяли?
    validations:
      required: false
